backend:
  name: git-gateway
  branch: main

media_folder: "src/images/haberler"
public_folder: "/images/haberler"

collections:
  - name: "haberler"
    label: "Haberler"
    label_singular: "Haber"
    folder: "src/haberler"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Başlık", name: "title", widget: "string" }
      - { label: "Tarih", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Kategori", name: "kategori", widget: "select", options: ["Kulüp", "Futbol", "Satranç", "Flag Futbol", "Maç Sonucu", "Aktivite", "Sakatlık Raporu"] }
      - { label: "Özet", name: "excerpt", widget: "text", hint: "Haber listesinde görünecek kısa özet." }
      - { label: "Kapak Görseli", name: "image", widget: "image", required: false }
      - { label: "İçerik", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "haber.njk" }
